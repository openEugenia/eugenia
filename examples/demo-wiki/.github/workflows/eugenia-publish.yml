# Publishes the public part of the wiki to openEugenia/demo-wiki-public on every push.
# Generated by Eugenia. Required secret: EUGENIA_DEPLOY_KEY (deploy key with write access
# to openEugenia/demo-wiki-public), created by `eugenia init --github`.
name: Eugenia — publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eugenia-publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: openEugenia/eugenia@v1
        with:
          target: openEugenia/demo-wiki-public
          deploy-key: ${{ secrets.EUGENIA_DEPLOY_KEY }}
